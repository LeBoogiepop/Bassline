name: Bassline queue tests
on:
  push:
    branches: [feat/redis-persistent-transcription-2026]
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/queue-tests.yml"
jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lightweight queue test dependencies
        run: |
          python -m pip install "flask==3.0.0" "flask-cors==4.0.0" "python-dotenv==1.0.0" "redis>=5,<6" "rq>=1.16,<2" "fakeredis>=2.23,<3"
      - name: Run queue and API tests
        run: python -m unittest discover -s backend/tests -p 'test_queue.py' -v
